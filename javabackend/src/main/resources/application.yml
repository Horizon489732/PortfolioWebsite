server:
  port: 8080

spring:
  application:
    name: javabackend

logging:
  level:
    org.springframework.web.reactive.function.client.ExchangeFunctions: TRACE

# Custom property for our factorization service
factorize:
  service:
    url: ${FACTORIZE_SERVICE_URL:http://localhost:8000}

#CORS
cors:
  allowed:
    origins: ${SPRING_CORS_ALLOWED_ORIGINS:http://localhost:3000}
