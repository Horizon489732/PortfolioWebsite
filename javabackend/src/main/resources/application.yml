server:
  port: 8080

spring:
  application:
    name: javabackend

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:../../.env[.properties]
      - optional:file:../../../.env[.properties]
      - optional:file:../../../../.env[.properties]
      - optional:file:../../../../../.env[.properties]
      - optional:file:../../../../../../.env[.properties]
      - optional:file:../../../../../../../.env[.properties]
      - optional:file:../../../../../../../../.env[.properties]
      - optional:file:../../../../../../../../../.env[.properties]

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${FROM_EMAIL_ADDRESS}
    password: ${FROM_EMAIL_APP_PASSWORD}
    protocol: smtp
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

logging:
  level:
    org.springframework.web.reactive.function.client.ExchangeFunctions: TRACE

# Custom property for our factorization service
factorize:
  service:
    url: ${FACTORIZE_SERVICE_URL:http://localhost:8000}

#CORS
cors:
  allowed:
    origins: ${SPRING_CORS_ALLOWED_ORIGINS:http://localhost:3000}
